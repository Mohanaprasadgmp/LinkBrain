<!DOCTYPE html>
<html lang="en">
<head>
  <title>HTML Title Tag</title>
  <meta name="description" content="The plain meta description.">
  <meta property="og:title" content="OG Title">
  <meta property="og:description" content="The OG description.">
  <meta property="og:image" content="/images/og-cover.png">
  <meta property="og:site_name" content="Example Site">
  <meta name="twitter:title" content="Twitter Title">
  <meta name="twitter:description" content="The twitter description.">
  <meta name="twitter:image" content="https://cdn.example.com/twitter-card.png">
  <link rel="icon" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
  <h1>Hello</h1>
</body>
</html>
