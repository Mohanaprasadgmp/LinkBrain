<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LinkBrain</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <span class="mark" aria-hidden="true">L</span>
      <span class="wordmark">LinkBrain</span>
      <span id="user-email" class="user-email" hidden></span>
    </header>

    <main id="app">
      <!-- Loading -->
      <section id="view-loading" class="view">
        <p class="muted">Loading…</p>
      </section>

      <!-- Unauthenticated -->
      <section id="view-signed-out" class="view" hidden>
        <p class="title">Sign in to LinkBrain</p>
        <p class="muted">Connect your account to save pages from Chrome.</p>
        <button id="open-linkbrain" class="btn btn-primary" type="button">Open LinkBrain</button>
      </section>

      <!-- Session expired -->
      <section id="view-expired" class="view" hidden>
        <p class="title">Your LinkBrain session has expired.</p>
        <button id="sign-in-again" class="btn btn-primary" type="button">Sign in again</button>
      </section>

      <!-- Extension not connected on this page (generic error state reused) -->
      <section id="view-error" class="view" hidden>
        <p class="title" id="error-title">Something went wrong.</p>
        <button id="retry" class="btn btn-secondary" type="button">Try again</button>
      </section>

      <!-- Authenticated: save form -->
      <section id="view-save" class="view" hidden>
        <div class="page-preview">
          <p id="page-title" class="page-title"></p>
          <p id="page-domain" class="muted"></p>
        </div>

        <label class="field">
          <span class="field-label">Project</span>
          <select id="project-select">
            <option value="">No project</option>
          </select>
        </label>

        <label class="field">
          <span class="field-label">Note</span>
          <textarea id="note-input" rows="2" placeholder="Why this is useful…"></textarea>
        </label>

        <button id="toggle-advanced" class="link-button" type="button">Status &amp; priority</button>
        <div id="advanced-fields" class="advanced-fields" hidden>
          <label class="field">
            <span class="field-label">Status</span>
            <select id="status-select">
              <option value="saved">Saved</option>
              <option value="reading">Reading</option>
              <option value="read">Read</option>
              <option value="archived">Archived</option>
            </select>
          </label>
          <label class="field">
            <span class="field-label">Priority</span>
            <select id="priority-select">
              <option value="useful">Useful</option>
              <option value="must-read">Must Read</option>
              <option value="maybe-later">Maybe Later</option>
              <option value="reference">Reference</option>
            </select>
          </label>
        </div>

        <button id="save-button" class="btn btn-primary btn-full" type="button">Save to LinkBrain</button>
        <p id="save-error" class="error-text" hidden></p>
      </section>

      <!-- Success -->
      <section id="view-success" class="view" hidden>
        <p class="title">Saved to LinkBrain</p>
        <button id="open-saved-link" class="btn btn-secondary" type="button">Open Link</button>
        <button id="save-another" class="link-button" type="button">Save another</button>
      </section>

      <!-- Duplicate -->
      <section id="view-duplicate" class="view" hidden>
        <p class="title">Already saved</p>
        <button id="open-existing-link" class="btn btn-secondary" type="button">Open existing link</button>
        <button id="save-anyway" class="link-button" type="button">Save anyway</button>
      </section>
    </main>

    <script type="module" src="dist/popup.js"></script>
  </body>
</html>
